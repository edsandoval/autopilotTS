<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>
  
  <!-- Character Body -->
  <g filter="url(#shadow)">
    <!-- Main body -->
    <rect x="50" y="60" width="412" height="400" rx="75" fill="url(#bodyGradient)"/>
    
    <!-- Eyes positioned at very top -->
    <!-- Left eye -->
    <circle cx="190" cy="74" r="34" fill="white"/>
    <circle cx="196" cy="74" r="19" fill="#1e293b"/>
    <circle cx="200" cy="69" r="7" fill="white"/>
    
    <!-- Right eye -->
    <circle cx="322" cy="74" r="34" fill="white"/>
    <circle cx="328" cy="74" r="19" fill="#1e293b"/>
    <circle cx="332" cy="69" r="7" fill="white"/>
    
    <!-- Glasses -->
    <!-- Left lens frame -->
    <circle cx="190" cy="74" r="36" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.8"/>
    <!-- Right lens frame -->
    <circle cx="322" cy="74" r="36" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.8"/>
    <!-- Bridge connecting lenses -->
    <line x1="226" y1="74" x2="286" y2="74" stroke="#1e293b" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    <!-- Left temple (arm) -->
    <path d="M 154 74 L 130 74 L 120 80" stroke="#1e293b" stroke-width="4" opacity="0.8" fill="none" stroke-linecap="round"/>
    <!-- Right temple (arm) -->
    <path d="M 358 74 L 382 74 L 392 80" stroke="#1e293b" stroke-width="4" opacity="0.8" fill="none" stroke-linecap="round"/>
    
    <!-- Code editor screen on body -->
    <rect x="90" y="125" width="332" height="295" rx="16" fill="#1e293b" opacity="0.9"/>
    
    <!-- Code lines with syntax highlighting -->
    <!-- Line 1 - purple keyword -->
    <rect x="115" y="185" width="80" height="17" rx="4" fill="#a78bfa"/>
    <rect x="200" y="185" width="100" height="17" rx="4" fill="#60a5fa"/>
    
    <!-- Line 2 - green string -->
    <rect x="115" y="217" width="60" height="17" rx="4" fill="#60a5fa"/>
    <rect x="180" y="217" width="150" height="17" rx="4" fill="#34d399"/>
    
    <!-- Line 3 - function -->
    <rect x="115" y="249" width="95" height="17" rx="4" fill="#f59e0b"/>
    <rect x="215" y="249" width="80" height="17" rx="4" fill="#60a5fa"/>
    
    <!-- Line 4 -->
    <rect x="135" y="281" width="125" height="17" rx="4" fill="#60a5fa"/>
    <rect x="265" y="281" width="65" height="17" rx="4" fill="#f472b6"/>
    
    <!-- Line 5 - closing bracket -->
    <rect x="115" y="313" width="45" height="17" rx="4" fill="#a78bfa"/>
    
    <!-- Line 6 -->
    <rect x="115" y="345" width="120" height="17" rx="4" fill="#60a5fa"/>
    
    <!-- Line 7 -->
    <rect x="115" y="377" width="95" height="17" rx="4" fill="#60a5fa"/>
    
    <!-- Terminal indicator dots -->
    <circle cx="105" cy="143" r="5" fill="#ef4444"/>
    <circle cx="119" cy="143" r="5" fill="#f59e0b"/>
    <circle cx="133" cy="143" r="5" fill="#10b981"/>
    
    <!-- Screen glow effect -->
    <rect x="90" y="125" width="332" height="295" rx="16" fill="url(#screenGlow)" opacity="0.4"/>
    
    <!-- Happy mouth/smile -->
    <path d="M 206 440 Q 256 460 306 440" stroke="#1e293b" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Brackets decoration on sides -->
    <text x="55" y="280" font-family="monospace" font-size="70" font-weight="bold" fill="#1e293b" opacity="0.25">{</text>
    <text x="420" y="280" font-family="monospace" font-size="60" font-weight="bold" fill="#1e293b" opacity="0.2">}</text>
  </g>
</svg>
